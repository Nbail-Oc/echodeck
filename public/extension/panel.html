<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EchoDeck Viewer Soundboard</title>
	<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			background: #09090b;
			color: #f4f4f5;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			width: 318px;
			height: 490px;
			padding: 10px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			overflow: hidden;
			background-image: radial-gradient(circle at 50% 0%, rgba(145, 70, 255, 0.14), transparent 75%);
		}

		/* CLEAN AUTHENTIC HEADER (No "ready" pill) */
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 8px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			flex-shrink: 0;
		}

		.brand-left {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.brand-logo {
			width: 26px;
			height: 26px;
			object-fit: contain;
			filter: drop-shadow(0 2px 6px rgba(145, 70, 255, 0.5));
		}

		.brand-meta h3 {
			font-size: 13px;
			font-weight: 800;
			letter-spacing: 0.4px;
			color: #ffffff;
			line-height: 1.1;
		}

		.brand-meta span {
			font-size: 9px;
			color: #a1a1aa;
			letter-spacing: 0.2px;
		}

		.cooldown-text {
			font-size: 9.5px;
			font-weight: 700;
			color: #a78bfa;
			padding: 3px 8px;
			background: rgba(145, 70, 255, 0.1);
			border-radius: 12px;
			border: 1px solid rgba(145, 70, 255, 0.2);
			transition: all 0.2s ease;
		}

		.cooldown-text.active {
			color: #f59e0b;
			background: rgba(245, 158, 11, 0.15);
			border-color: rgba(245, 158, 11, 0.4);
		}

		/* VERTICAL SCROLL FEED */
		.scroll-feed {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			margin: 6px 0;
			padding-right: 4px;
			scrollbar-width: thin;
			scrollbar-color: #3f3f46 transparent;
		}

		.scroll-feed::-webkit-scrollbar {
			width: 4px;
		}

		.scroll-feed::-webkit-scrollbar-thumb {
			background: #3f3f46;
			border-radius: 4px;
		}

		/* SECTION HEADINGS */
		.sec-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			color: #71717a;
			letter-spacing: 0.6px;
			margin: 6px 0 6px 2px;
		}

		/* SECTION 1: 6 CIRCULAR BUZZERS WITH VECTOR ICONS */
		.buzzer-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 12px 6px;
			justify-items: center;
			margin-bottom: 12px;
		}

		.buzzer-unit {
			display: flex;
			flex-direction: column;
			align-items: center;
			cursor: pointer;
			width: 78px;
			transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
		}

		.buzzer-circle {
			width: 54px;
			height: 54px;
			border-radius: 50%;
			background: var(--btn-color);
			display: flex;
			align-items: center;
			justify-content: center;
			color: #ffffff;
			box-shadow: 
				0 4px 10px rgba(0, 0, 0, 0.5),
				inset 0 2px 2px rgba(255, 255, 255, 0.3),
				inset 0 -3px 4px rgba(0, 0, 0, 0.4);
			transition: all 0.12s ease;
			position: relative;
		}

		.buzzer-circle svg {
			filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
		}

		.buzzer-unit:hover .buzzer-circle {
			transform: scale(1.08);
			box-shadow: 
				0 6px 16px rgba(145, 70, 255, 0.4),
				inset 0 2px 2px rgba(255, 255, 255, 0.4);
		}

		.buzzer-unit:active .buzzer-circle, .buzzer-unit.active-pop .buzzer-circle {
			transform: scale(0.92);
			box-shadow: 
				0 1px 4px rgba(0, 0, 0, 0.8),
				0 0 16px #00f593;
		}

		.buzzer-title {
			font-size: 10px;
			font-weight: 700;
			color: #f4f4f5;
			margin-top: 5px;
			text-align: center;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 76px;
		}

		/* Compact Take Switcher for sounds with Mimic Take */
		.take-pill {
			display: flex;
			align-items: center;
			background: #18181f;
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 8px;
			margin-top: 3px;
			padding: 1px;
			gap: 1px;
			width: 68px;
		}

		.take-opt {
			flex: 1;
			background: transparent;
			border: none;
			color: #71717a;
			font-size: 7.5px;
			font-weight: 700;
			padding: 2px 0;
			border-radius: 6px;
			cursor: pointer;
			text-align: center;
			transition: all 0.12s ease;
		}

		.take-opt.active {
			background: #9146FF;
			color: #ffffff;
		}

		/* SECTION 2: 3 SQUARE STICKERS / GIFS */
		.sticker-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
			margin-bottom: 4px;
		}

		.sticker-card {
			background: #141418;
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 12px;
			aspect-ratio: 1 / 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 4px;
			cursor: pointer;
			position: relative;
			overflow: hidden;
			transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
		}

		.sticker-card:hover {
			border-color: #9146FF;
			transform: translateY(-3px) scale(1.03);
			box-shadow: 0 8px 18px rgba(145, 70, 255, 0.3);
		}

		.sticker-card:active, .sticker-card.active-pop {
			transform: scale(0.92);
			border-color: #00f593;
			box-shadow: 0 0 16px rgba(0, 245, 147, 0.5);
		}

		.sticker-img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 8px;
			pointer-events: none;
		}

		.sticker-overlay {
			position: absolute;
			bottom: 4px;
			left: 4px;
			right: 4px;
			background: rgba(0, 0, 0, 0.75);
			backdrop-filter: blur(4px);
			border-radius: 6px;
			font-size: 8px;
			font-weight: 800;
			color: #ffffff;
			text-align: center;
			padding: 2px 0;
			letter-spacing: 0.3px;
		}

		/* FLOATING REACTION BURST */
		.float-pop {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: 11px;
			font-weight: 900;
			color: #00f593;
			background: rgba(0, 0, 0, 0.85);
			padding: 2px 6px;
			border-radius: 6px;
			border: 1px solid #00f593;
			pointer-events: none;
			animation: popFly 0.5s ease-out forwards;
			z-index: 20;
		}

		@keyframes popFly {
			0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
			100% { opacity: 0; transform: translate(-50%, -120%) scale(1.2); }
		}

		/* FOOTER */
		.footer {
			border-top: 1px solid rgba(255, 255, 255, 0.08);
			padding-top: 6px;
			flex-shrink: 0;
		}

		.vol-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 10px;
			color: #a1a1aa;
			margin-bottom: 3px;
		}

		.vol-left {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.mute-btn {
			background: transparent;
			border: none;
			color: #a1a1aa;
			cursor: pointer;
			font-size: 12px;
		}

		.mute-btn:hover {
			color: #ffffff;
		}

		input[type=range] {
			width: 100%;
			accent-color: #9146FF;
			cursor: pointer;
			height: 3px;
		}

		.status-text {
			font-size: 9px;
			color: #bf94ff;
			text-align: center;
			font-weight: 600;
			margin-top: 4px;
			min-height: 12px;
		}
	</style>
</head>

	<div class="scroll-feed" id="scroll-feed">
		<!-- Section 1: 6 Circular Buzzers with Vector Icons -->
		<div class="sec-label">Sound Effects</div>
		<div class="buzzer-grid" id="buzzer-grid"></div>

		<!-- Section 2: 3 Square Stickers / GIFs -->
		<div class="sec-label">Live Stickers & GIFs</div>

	<div class="footer">

			<div class="vol-left">

			</div>

		</div>
		<input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.8">
